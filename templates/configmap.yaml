apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nofire-edge.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nofire-edge.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "logLevel": {{ .Values.config.logLevel | quote }},
      "serverPort": {{ .Values.config.serverPort }},
      "graph": {
        "pruneInterval": {{ .Values.config.graph.pruneInterval | quote }},
        "maxPruneAge": {{ .Values.config.graph.maxPruneAge | quote }}
      },
      "kube": {
        "configPath": {{ .Values.config.kube.configPath | quote }},
        "resyncInterval": {{ .Values.config.kube.resyncInterval | quote }},
        "clusterName": {{ .Values.config.kube.clusterName | quote }},
        "resources": [
          {{- range $index, $resource := .Values.config.kube.resources }}
          {{- if $index }},{{ end }}
          {{ $resource | quote }}
          {{- end }}
        ]
        {{- $nf := pick (.Values.config.kube.namespaceFilter | default dict) "mode" "namespaces" }}
        {{- if $nf }}
        {{- /* Mirror the Edge's validation so a bad filter fails at install, not as a crashloop. */}}
        {{- $mode := printf "%v" (get $nf "mode" | default "") }}
        {{- $namespaces := get $nf "namespaces" | default list }}
        {{- if not (kindIs "slice" $namespaces) }}
        {{- fail "config.kube.namespaceFilter.namespaces must be a list" }}
        {{- end }}
        {{- if has $mode (list "" "none") }}
        {{- if $namespaces }}
        {{- fail (printf "config.kube.namespaceFilter.namespaces is set but mode %q disables filtering; set config.kube.namespaceFilter.mode to 'allow' or 'deny'" $mode) }}
        {{- end }}
        {{- else if has $mode (list "allow" "deny") }}
        {{- if not $namespaces }}
        {{- fail (printf "config.kube.namespaceFilter.mode is %q but config.kube.namespaceFilter.namespaces is empty" $mode) }}
        {{- end }}
        {{- else }}
        {{- fail (printf "config.kube.namespaceFilter.mode must be one of '', 'none', 'allow', 'deny' (got %q)" $mode) }}
        {{- end }},
        "namespaceFilter": {{ $nf | toJson }}
        {{- end }}
      },
      "enableCausalAnalysis": {{ .Values.config.enableCausalAnalysis }},
      "causal": {
        "algorithm": {{ .Values.config.causal.algorithm | quote }},
        "interval": {{ .Values.config.causal.interval | quote }}
      },
      "sentry": {
        "dsn": {{ .Values.config.sentry.dsn | default "" | quote }},
        "environment": {{ .Values.config.sentry.environment | default "" | quote }},
        "release": {{ .Values.config.sentry.release | default "" | quote }},
        "debug": {{ .Values.config.sentry.debug | default false }},
        "sampleRate": {{ .Values.config.sentry.sampleRate | default 1.0 }},
        "tracesSampleRate": {{ .Values.config.sentry.tracesSampleRate | default 0.0 }}
      },
      "services": {{ include "nofire-edge.servicesJson" . }},
      "enablePublishing": {{ .Values.config.enablePublishing }},
      "publisher": {
        "apiKey": {{ if .Values.config.publisher.apiKeySecret.enabled }}"{NOFIRE_API_KEY}"{{ else }}{{ .Values.config.publisher.apiKey | default "" | quote }}{{ end }},
        "timeout": {{ .Values.config.publisher.timeout | quote }},
        "maxRetries": {{ .Values.config.publisher.maxRetries }},
        "retryDelay": {{ .Values.config.publisher.retryDelay | quote }},
        "enableCompression": {{ .Values.config.publisher.enableCompression }},
        "graph": {
          "url": {{ .Values.config.publisher.graph.url | default "" | quote }},
          "interval": {{ .Values.config.publisher.graph.interval | quote }}
        },
        "heartbeat": {
          "url": {{ .Values.config.publisher.heartbeat.url | default "" | quote }},
          "interval": {{ .Values.config.publisher.heartbeat.interval | quote }}
        }
      },
      "netobs": {
        "enabled": {{ .Values.config.netobs.enabled | default false }},
        "interval": {{ .Values.config.netobs.interval | default "60s" | quote }},
        "prometheusUrl": {{ .Values.config.netobs.prometheusUrl | default "" | quote }},
        "source": {{ .Values.config.netobs.source | default "" | quote }},
        "prometheusTimeout": {{ .Values.config.netobs.prometheusTimeout | default "10s" | quote }}
        {{- if and (hasKey .Values.config.netobs "edgeExistenceTtl") (not (kindIs "invalid" .Values.config.netobs.edgeExistenceTtl)) }},
        "edgeExistenceTtl": {{ .Values.config.netobs.edgeExistenceTtl | quote }}
        {{- end }}
        {{- if and (hasKey .Values.config.netobs "excludeNamespaces") (not (kindIs "invalid" .Values.config.netobs.excludeNamespaces)) }},
        "excludeNamespaces": {{ .Values.config.netobs.excludeNamespaces | toJson }}
        {{- end }}
      },
      "configMapCapture": {
        "clearText": {{ .Values.config.configMapCapture.clearText | default false }},
        "captureCap": {{ .Values.config.configMapCapture.captureCap | default 4096 }},
        "redactKeyPatterns": [
          {{- range $index, $pattern := .Values.config.configMapCapture.redactKeyPatterns }}
          {{- if $index }},{{ end }}
          {{ $pattern | quote }}
          {{- end }}
        ]
      },
      "envCapture": {
        "clearText": {{ .Values.config.envCapture.clearText | default false }},
        "captureCap": {{ .Values.config.envCapture.captureCap | default 4096 }},
        "redactKeyPatterns": [
          {{- range $index, $pattern := .Values.config.envCapture.redactKeyPatterns }}
          {{- if $index }},{{ end }}
          {{ $pattern | quote }}
          {{- end }}
        ]
      }
    }
