{{- if and .Values.edgeProxy.enabled .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nofire-edge.edgeProxy.fullname" . }}
  labels:
    {{- include "nofire-edge.edgeProxy.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nofire-edge.edgeProxy.fullname" . }}
  labels:
    {{- include "nofire-edge.edgeProxy.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nofire-edge.edgeProxy.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "nofire-edge.edgeProxy.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
