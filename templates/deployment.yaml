apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nofire-edge.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nofire-edge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nofire-edge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Force pod restart when config changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "nofire-edge.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nofire-edge.serviceAccountName" . }}
      restartPolicy: Always
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.initContainers .Values.config.publisher.apiKeySecret.enabled }}
      initContainers:
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.config.publisher.apiKeySecret.enabled }}
        # Substitutes the API key from the Secret into config.json and writes it
        # to an in-memory (tmpfs) volume. The main /nofire-edge binary does not
        # expand env placeholders itself, so the key is injected here — it never
        # lands in a persisted ConfigMap, in git, or on node disk.
        - name: render-config
          image: {{ .Values.config.publisher.apiKeySecret.initImage }}
          command: ["sh", "-c"]
          args:
            - sed "s|{NOFIRE_API_KEY}|${NOFIRE_API_KEY}|g" /tmp/config-src/config.json > /etc/nofire-edge/config.json
          env:
            - name: NOFIRE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.publisher.apiKeySecret.name }}
                  key: {{ .Values.config.publisher.apiKeySecret.key }}
          volumeMounts:
            - name: client-config
              mountPath: /tmp/config-src
              readOnly: true
            - name: rendered-config
              mountPath: /etc/nofire-edge
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "nofire-edge.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/nofire-edge"]
          args: ["--config", "/etc/nofire-edge/config.json"]
          env:
            {{- if .Values.nodeName.enabled }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: {{ .Values.nodeName.fieldPath }}
            {{- end }}
            - name: PORT
              value: {{ .Values.config.serverPort | quote }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.config.serverPort }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: {{ ternary "rendered-config" "client-config" .Values.config.publisher.apiKeySecret.enabled }}
              mountPath: /etc/nofire-edge
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: client-config
          configMap:
            name: {{ include "nofire-edge.configName" . }}
        {{- if .Values.config.publisher.apiKeySecret.enabled }}
        # tmpfs (RAM) — holds the rendered config.json with the real key; never
        # written to node disk, gone when the pod dies.
        - name: rendered-config
          emptyDir:
            medium: Memory
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }} 