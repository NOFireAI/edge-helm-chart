{{- if .Values.networkPolicy.enabled }}
# Ingress to the agent pod: HTTP (/healthz, /metrics) and dnstap only.
# The graph and admin endpoints are loopback-only inside the pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nofire-edge.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nofire-edge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nofire-edge.selectorLabels" . | nindent 6 }}
    # edge-proxy pods carry the same name/instance labels plus a component label.
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: DoesNotExist
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.config.serverPort }}
          protocol: TCP
      {{- with .Values.networkPolicy.httpFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - port: {{ .Values.service.dnstapPort }}
          protocol: TCP
      {{- with .Values.networkPolicy.dnstapFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
