suite: rbac
templates:
  - templates/rbac.yaml
tests:
  - it: lets the default ClusterRole read endpoints
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - contains:
          path: rules[0].resources
          content: endpoints
      - equal:
          path: rules[0].verbs
          value: [get, list, watch]
  - it: lets the default ClusterRole read the CronJob, PriorityClass, RBAC and Calico kinds
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [batch]
            resources: [jobs, cronjobs]
            verbs: [get, list, watch]
      - contains:
          path: rules
          content:
            apiGroups: [scheduling.k8s.io]
            resources: [priorityclasses]
            verbs: [get, list, watch]
      - contains:
          path: rules
          content:
            apiGroups: [rbac.authorization.k8s.io]
            resources: [roles, clusterroles, rolebindings, clusterrolebindings]
            verbs: [get, list, watch]
      - contains:
          path: rules
          content:
            apiGroups: [crd.projectcalico.org]
            resources: [ippools, bgppeers, ipamconfigs]
            verbs: [get, list, watch]
  - it: lets the default ClusterRole read IngressClass, Gateway API and Traefik routing kinds
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [networking.k8s.io]
            resources: [ingresses, ingressclasses, networkpolicies]
            verbs: [get, list, watch]
      - contains:
          path: rules
          content:
            apiGroups: [gateway.networking.k8s.io]
            resources: [gatewayclasses, gateways, httproutes, grpcroutes, tlsroutes, tcproutes, udproutes, referencegrants]
            verbs: [get, list, watch]
      - contains:
          path: rules
          content:
            apiGroups: [traefik.io, traefik.containo.us]
            resources: [ingressroutes, ingressroutetcps, ingressrouteudps, traefikservices]
            verbs: [get, list, watch]
  - it: lets the default ClusterRole read admission webhook configurations
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [admissionregistration.k8s.io]
            resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations]
            verbs: [get, list, watch]
