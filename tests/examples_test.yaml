suite: examples
templates:
  - templates/configmap.yaml
  - templates/rbac.yaml
values:
  - ../examples/production-values.yaml
tests:
  - it: watches endpoints in the production example
    template: templates/configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.json"]
          pattern: '"endpoints"'

  - it: grants endpoints access in the production example
    template: templates/rbac.yaml
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - contains:
          path: rules[0].resources
          content: endpoints
