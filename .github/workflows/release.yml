name: Release Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'Chart.yaml'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Do not leave the job token in .git/config as an http.extraheader:
          # `helm package .` would ship it inside the chart. Nothing here pushes
          # over git — `gh release create` authenticates via GH_TOKEN.
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Extract chart metadata
        id: chart
        run: |
          echo "name=$(grep '^name:' Chart.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "version=$(grep '^version:' Chart.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}"
          if gh release view "$tag" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package chart
        if: steps.check.outputs.exists == 'false'
        run: helm package .

      # This packaging fault shipped silently once (0.5.1 was 1.4MB of .git and
      # nested tarballs, over helm's 1MiB release-secret limit, and carried the
      # CI token). Fail loudly rather than publish it again.
      - name: Verify packaged chart
        if: steps.check.outputs.exists == 'false'
        run: |
          pkg="${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}.tgz"
          if tar tzf "$pkg" | grep -qE '(^|/)\.git(/|$)'; then
            echo "::error::$pkg contains .git — packaging leak"
            exit 1
          fi
          size=$(wc -c < "$pkg")
          if [ "$size" -gt 524288 ]; then
            echo "::error::$pkg is ${size} bytes (>512KB) — packaging leak?"
            exit 1
          fi
          echo "$pkg is ${size} bytes"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            "${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}.tgz"

      - name: Checkout gh-pages
        if: steps.check.outputs.exists == 'false'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update Helm repo index
        if: steps.check.outputs.exists == 'false'
        run: |
          pkg="${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}.tgz"
          cp "$pkg" gh-pages/
          if [ -f gh-pages/index.yaml ]; then
            helm repo index gh-pages --url https://nofireai.github.io/edge-helm-chart/ --merge gh-pages/index.yaml
          else
            helm repo index gh-pages --url https://nofireai.github.io/edge-helm-chart/
          fi

      - name: Push to gh-pages
        if: steps.check.outputs.exists == 'false'
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(release): ${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}"
          git push

  # Release metadata for the NOFire AI dashboard (NOFireAI/engineering#1983): it
  # reads edge/latest.json at https://releases.nofire.ai to pick the chart
  # version customers install, and tests/dashboard_install_test.yaml is the gate.
  # A job of its own, so the AWS role's OIDC token never shares a job with the
  # release's write token. Runs on every run (each write is idempotent); skipped
  # until the RELEASE_METADATA_ROLE_ARN repository variable is set. aws, gh and
  # helm come with the runner image; setup-go uses the Go it already caches.
  publish-metadata:
    needs: release
    if: vars.RELEASE_METADATA_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.RELEASE_METADATA_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publish release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run .github/scripts/publish-release-metadata/main.go
